ices, 504);\n  const recentReturns = returns.slice(-252);\n  const driftWindow = returns.slice(-126);\n  const meanReturn = recentReturns.length ? calcMean(recentReturns) : 0;\n  const sampleVol = recentReturns.length > 20 ? calcStd(recentReturns, meanReturn) : 0.02;\n  let dailyDrift = driftWindow.length ? calcMean(driftWindow) * TRAINED_PIVOT_HIT_MODEL.driftShrink : 0.0002;\n  let dailyVol = calcEwmaVol(recentReturns.length ? recentReturns : returns, 0.94);\n\n  dailyDrift = clamp(dailyDrift, -0.0030, 0.0030);\n  dailyVol = clamp(dailyVol, 0.005, 0.120);\n\n  const horizon = remainingTradingDaysToYearEnd();\n  const paths = TRAINED_PIVOT_HIT_MODEL.uiPaths || TRAINED_PIVOT_HIT_MODEL.paths || 20000;\n  const seed = Math.round(price * 100) + Math.round(support.value * 10) + Math.round(resistance.value * 10) + horizon + paths;\n  const rand = seededRandom(seed);\n\n  let up = 0;\n  let down = 0;\n  let none = 0;\n  let upHitDaySum = 0;\n  let downHitDaySum = 0;\n\n  for (let i = 0; i < paths; i++) {\n    let p = price;\n    let touched = false;\n    for (let t = 0; t < horizon; t++) {\n      const open = p;\n      const returnShock = sampleBootstrappedReturn(recentReturns, meanReturn, sampleVol, dailyVol, dailyDrift, rand);\n      const close = open * Math.exp(returnShock);\n      const range = estimateIntradayRange(returnShock, dailyVol, rand);\n      const dayHIGH = Math.max(open, close) * Math.exp(range * 0.5);\n      const dayLow = Math.min(open, close) * Math.exp(-range * 0.5);\n      const hitUp = dayHIGH >= resistance.value;\n      const hitDown = dayLow <= support.value;\n\n      if (hitUp && hitDown) {\n        const upDistance = Math.abs(Math.log(resistance.value / open));\n        const downDistance = Math.abs(Math.log(open / support.value));\n        if (upDistance <= downDistance) {\n          up++;\n          upHitDaySum += t + 1;\n        } else {\n          down++;\n          downHitDaySum += t + 1;\n        }\n        touched = true;\n        break;\n      }\n      if (hitUp) {\n        up++;\n        upHitDaySum += t + 1;\n        touched = true;\n        break;\n      }\n      if (hitDown) {\n        down++;\n        downHitDaySum += t + 1;\n        touched = true;\n        break;\n      }\n      p = close;\n    }\n    if (!touched) none++;\n  }\n\n  const resolved = up + down;\n  const rawPairUp = resolved > 0 ? up / resolved : 0.5;\n  const calibratedPairUp = calibrateMonteCarloProbability(rawPairUp);\n  const expectedResistanceHitDays = up > 0 ? upHitDaySum / up : null;\n  const expectedSupportHitDays = down > 0 ? downHitDaySum / down : null;\n  const expectedHitDays = resolved > 0 ? (upHitDaySum + downHitDaySum) / resolved : null;\n\n  return {\n    resistanceFirst: up / paths,\n    supportFirst: down / paths,\n    noTouch: none / paths,\n    dailyDrift,\n    dailyVol,\n    horizon,\n    rawPairUp,\n    calibratedPairUp,\n    expectedHitDays,\n    expectedResistanceHitDays,\n    expectedSupportHitDays\n  };\n}\nfunction percent(value) {\n  return `${(value * 100).toFixed(1)}%`;\n}\nfunction formatExpectedHitTime(days) {\n  if (!Number.isFinite(days)) return \"NO RESOLVED HIT\";\n  return `${Math.max(1, Math.round(days))} CALENDAR DAYS`;\n}\nfunction getValidatedEdgeLabel(auc) {\n  if (!Number.isFinite(auc)) return \"UNVALIDATED\";\n  if (auc < 0.55) return \"NOISE\";\n  if (auc < 0.60) return \"WEAK\";\n  if (auc < 0.65) return \"USEFUL\";\n  if (auc < 0.70) return \"STRONG\";\n  if (auc < 0.75) return \"HIGH\";\n  return \"VERY HIGH\";\n}\nfunction getPivotHitForecast(price) {\n  const barriers = getNextPivotBarriers(price);\n  const support = barriers.support;\n  const resistance = barriers.resistance;\n\n  if (!support || !resistance) {\n    return {\n      cards: [\n        forecastCard(\"STATUS\", \"OUTSIDE TRAINED PIVOT LADDER\"),\n        forecastCard(\"MODEL\", \"AWAIT NEXT ANNUAL PIVOT REFRESH\")\n      ]\n    };\n  }\n\n  const mc = runPivotMonteCarlo(price, support, resistance);\n  const mcPairUp = mc.rawPairUp;\n  const mcPairDown = 1 - mcPairUp;\n  const calibratedPairUp = mc.calibratedPairUp;\n  const calibratedPairDown = 1 - calibratedPairUp;\n\n  let path = \"RANGE / NO CLEAR EDGE\";\n  if (calibratedPairUp - calibratedPairDown >= 0.10) path = `${resistance.level} FIRST · BULL DOMINANT`;\n  if (calibratedPairDown - calibratedPairUp >= 0.10) path = `${support.level} FIRST · BEAR DOMINANT`;\n  const expectedHitDays = path.includes(\"BULL DOMINANT\")\n    ? mc.expectedResistanceHitDays\n    : path.includes(\"BEAR DOMINANT\")\n      ? mc.expectedSupportHitDays\n      : mc.expectedHitDays;\n\n\n  return {\n    support,\n    resistance,\n    cards: [\n      forecastCard(\"NEXT YEARLY RESISTANCE\", `${resistance.level} $${format(resistance.value)}`),\n      forecastCard(\"NEXT YEARLY SUPPORT\", `${support.level} $${format(support.value)}`),\n      forecastCard(\"MONTE CARLO FIRST-HIT\", `${resistance.level} ${percent(mcPairUp)} · ${support.level} ${percent(mcPairDown)}`),\n      forecastCard(\"CALIBRATED FORECAST\", `${resistance.level} ${percent(calibratedPairUp)} · ${support.level} ${percent(calibratedPairDown)}`),\n      forecastCard(\"NO-HIT PATHS\", `${percent(mc.noTouch)} · ${mc.horizon}D HORIZON`),\n      forecastCard(\"PRIMARY PATH\", path),\n      forecastCard(\"EXPECTED HIT TIME\", formatExpectedHitTime(expectedHitDays)),\n      forecastCard(\"MODEL CONFIDENCE\", `${getValidatedEdgeLabel(TRAINED_PIVOT_HIT_MODEL.auc)} · 7D VALIDATED`)\n    ]\n  };\n}\n\nfunction render() {\n  refreshIndicators();\n  const zone = getZone(state.price);\n  const statState = getStatState(state.zScore, state.percentB);\n  const signal = getSignal(state.price, statState);\n  const monthlyPivotLevel = Number.isFinite(state.monthlyPivot) ? state.monthlyPivot : YEARLY_PIVOTS.P;\n\n  document.getElementById(\"feedLabel\").textContent = `FEED ${state.feedStatus}${state.lastUpdated ? \" \" + new Date(state.lastUpdated).toLocaleTimeString() : \"\"}`;\n  document.getElementById(\"priceSourceBox\").textContent = state.priceSource === \"LIVE\" ? \"\" : String(state.priceSource).toUpperCase();\n  const warningBox = document.getElementById(\"warningBox\");\n  warningBox.textContent = state.warning || \"\";\n  warningBox.style.display = state.warning ? \"block\" : \"none\";\n\n  document.getElementById(\"priceBox\").textContent = `$${format(state.price)}`;\n  const regimeBox = document.getElementById(\"regimeBox\");\n  regimeBox.textContent = zone;\n  regimeBox.className = toneClass(zone);\n  const signalBox = document.getElementById(\"signalBox\");\n  signalBox.textContent = signal;\n  signalBox.className = signalToneClass(signal);\n  const stateBox = document.getElementById(\"stateBox\");\n  stateBox.textContent = statState;\n  stateBox.className = statStateToneClass(statState);\n  document.getElementById(\"monthlyPivotLevelBox\").textContent = `$${format(monthlyPivotLevel)}`;\n  const monthlyPivotBox = document.getElementById(\"monthlyPivotBox\");\n  monthlyPivotBox.textContent = getMonthlyPivotState(state.price);\n  monthlyPivotBox.className = monthlyPivotToneClass(state.price);\n  document.getElementById(\"zScoreBox\").textContent = state.zScore !== null ? state.zScore.toFixed(2) : \"—\";\n  document.getElementById(\"percentBBox\").textContent = state.percentB !== null ? state.percentB.toFixed(2) : \"—\";\n\n  const pivotForecast = getPivotHitForecast(state.price);\n  document.getElementById(\"pivotForecastCards\").innerHTML = pivotForecast.cards.join(\"\");\n  document.getElementById(\"backtestValidationCards\").innerHTML = [\n    forecastCard(\"HISTORICAL HIT-RATE\", \"AUC 0.740 · BRIER 0.230\"),\n    forecastCard(\"MONTE CARLO\", `AUC ${TRAINED_PIVOT_HIT_MODEL.monteCarloOnlyAuc.toFixed(3)} · BRIER ${TRAINED_PIVOT_HIT_MODEL.monteCarloOnlyBrier.toFixed(3)}`),\n    forecastCard(\"CALIBRATED MONTE CARLO\", `AUC ${TRAINED_PIVOT_HIT_MODEL.auc.toFixed(3)} · BRIER ${TRAINED_PIVOT_HIT_MODEL.brier.toFixed(3)}`),\n    forecastCard(\"ACCURACY\", `${(TRAINED_PIVOT_HIT_MODEL.accuracy * 100).toFixed(1)}% @ 0.5 THRESHOLD`),\n    forecastCard(\"CALIBRATION\", TRAINED_PIVOT_HIT_MODEL.calibration),\n    forecastCard(\"VOLATILITY\", TRAINED_PIVOT_HIT_MODEL.volModel),\n    forecastCard(\"VOLATILITY SHOCKS\", TRAINED_PIVOT_HIT_MODEL.shockModel),\n    forecastCard(\"MODEL PRIMARY TEST\", \"7D VALIDATED · HIGH/LOW FIRST-HIT\")\n  ].join(\"\");\n\n}\n\ndocument.querySelectorAll(\".asset-btn\").forEach((btn) => btn.addEventListener(\"click\", () => refreshPrice()));\nloadCache(state.assetKey);\nrefreshIndicators();\nrender();\n\nconst REFRESH_MS = 120000;\nwindow.setInterval(refreshPrice, REFRESH_MS);\nsetTimeout(refreshPrice, 500);\nwindow.addEventListener(\"focus\", refreshPrice);\nwindow.addEventListener(\"online\", refreshPrice);\ndocument.addEventListener(\"visibilitychange\", () => {\n  if (!document.hidden) refreshPrice();\n});\n<\/script>\n</body>\n</html>\n";

const frames = {
  "page-1m": document.getElementById("page-1m"),
  "page-12m": document.getElementById("page-12m")
};

frames["page-1m"].srcdoc = PAGE_1M_HTML;
frames["page-12m"].srcdoc = PAGE_1Y_HTML;

function activeFrame() {
  return document.querySelector(".page-frame.active");
}

function resizeFrame(frame) {
  if (!frame || !frame.contentWindow || !frame.contentWindow.document) return;
  const doc = frame.contentWindow.document;
  const app = doc.querySelector(".app");
  const contentHeight = app
    ? Math.ceil(app.getBoundingClientRect().bottom)
    : Math.ceil(Math.max(
        doc.body ? doc.body.scrollHeight : 0,
        doc.documentElement ? doc.documentElement.scrollHeight : 0
      ));
  frame.style.height = `${Math.max(contentHeight, 1)}px`;
}

function resizeActiveFrame() {
  resizeFrame(activeFrame());
}

Object.values(frames).forEach((frame) => {
  frame.addEventListener("load", () => {
    resizeFrame(frame);
    try {
      const doc = frame.contentWindow.document;
      const observer = new MutationObserver(() => resizeFrame(frame));
      observer.observe(doc.documentElement, { childList: true, subtree: true, attributes: true, characterData: true });
    } catch (error) {}
  });
});

function selectPage(target) {
  if (!frames[target]) return;
  document.querySelectorAll(".page-frame").forEach((frame) => frame.classList.toggle("active", frame.id === target));
  history.replaceState(null, "", `#${target.replace("page-", "")}`);
  setTimeout(resizeActiveFrame, 50);
}

function openHashPage() {
  const hash = window.location.hash.replace("#", "").toLowerCase();
  if (hash === "12m") selectPage("page-12m");
  if (hash === "1m") selectPage("page-1m");
}

window.addEventListener("resize", resizeActiveFrame);
window.addEventListener("hashchange", openHashPage);
window.setInterval(resizeActiveFrame, 1000);
openHashPage();
</script>
