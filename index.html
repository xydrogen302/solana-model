  throw lastError || new Error("BINANCE DAILY OHLC UNAVAILABLE");
}
async function canonicalFetchCompleteDailyOhlc(start, end) {
  try { return await canonicalFetchCoinGeckoDaily(start, end); } catch (_) {}
  return canonicalFetchBinanceDaily(start, end);
}
async function canonicalBuildFromNetwork(windowSpec, kind) {
  const fetched = await canonicalFetchCompleteDailyOhlc(windowSpec.start, windowSpec.end);
  const points = fetched.points;
  const high = Math.max(...points.map((p) => p.high));
  const low = Math.min(...points.map((p) => p.low));
  const close = points[points.length - 1].close;
  const record = canonicalBuildRecord({
    activePeriod: windowSpec.activePeriod,
    sourcePeriod: windowSpec.sourcePeriod,
    high, low, close,
    source: fetched.source
  }, kind);
  if (!record) throw new Error("PIVOT CALCULATION FAILED");
  record.dayCount = points.length;
  record.firstDay = points[0].timestamp;
  record.lastDay = points[points.length - 1].timestamp;
  return record;
}
async function canonicalResolveRecord(windowSpec, kind) {
  const seeded = canonicalSeedFor(windowSpec, kind);
  if (seeded) { canonicalStoreRecord(seeded); return seeded; }
  const cached = canonicalCachedRecord(windowSpec, kind);
  if (cached) return cached;
  try {
    const record = await canonicalBuildFromNetwork(windowSpec, kind);
    canonicalStoreRecord(record);
    return record;
  } catch (err) {
    return canonicalUnavailable(windowSpec, kind, err && err.message);
  }
}
let canonicalPivotPromise = null;
let canonicalPivotPeriodKey = "";
window.getSharedSolanaPivotSnapshot = async function() {
  const windows = canonicalPeriodWindows(Date.now());
  const periodKey = `${windows.month.activePeriod}|${windows.year.activePeriod}`;
  if (canonicalPivotPromise && canonicalPivotPeriodKey === periodKey) return canonicalPivotPromise;
  canonicalPivotPeriodKey = periodKey;
  canonicalPivotPromise = (async () => {
    const [monthly, yearly] = await Promise.all([
      canonicalResolveRecord(windows.month, "monthly"),
      canonicalResolveRecord(windows.year, "yearly")
    ]);
    return { periodKey, monthly, yearly, generatedAt: Date.now() };
  })();
  return canonicalPivotPromise;
};
function canonicalInvalidateIfBoundaryChanged() {
  const windows = canonicalPeriodWindows(Date.now());
  const currentKey = `${windows.month.activePeriod}|${windows.year.activePeriod}`;
  if (currentKey === canonicalPivotPeriodKey) return;
  canonicalPivotPromise = null;
  canonicalPivotPeriodKey = "";
  window.getSharedSolanaPivotSnapshot().catch(() => {});
}
window.setInterval(canonicalInvalidateIfBoundaryChanged, 60000);
window.addEventListener("focus", canonicalInvalidateIfBoundaryChanged);
window.addEventListener("online", () => {
  canonicalPivotPromise = null;
  canonicalPivotPeriodKey = "";
  window.getSharedSolanaPivotSnapshot().catch(() => {});
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) canonicalInvalidateIfBoundaryChanged();
});
// Prime exact-current pivot data before child refreshes begin.
window.getSharedSolanaPivotSnapshot().catch(() => {});

const frames = {
  "page-1m": document.getElementById("page-1m"),
  "page-12m": document.getElementById("page-12m")
};

frames["page-1m"].srcdoc = PAGE_1M_HTML;
frames["page-12m"].srcdoc = PAGE_1Y_HTML;

function activeFrame() {
  return document.querySelector(".page-frame.active");
}

function resizeFrame(frame) {
  if (!frame || !frame.contentWindow || !frame.contentWindow.document) return;
  const doc = frame.contentWindow.document;
  const app = doc.querySelector(".app");
  const contentHeight = app
    ? Math.ceil(app.getBoundingClientRect().bottom)
    : Math.ceil(Math.max(
        doc.body ? doc.body.scrollHeight : 0,
        doc.documentElement ? doc.documentElement.scrollHeight : 0
      ));
  frame.style.height = `${Math.max(contentHeight, 1)}px`;
}

function resizeActiveFrame() {
  resizeFrame(activeFrame());
}

Object.values(frames).forEach((frame) => {
  frame.addEventListener("load", () => {
    resizeFrame(frame);
    try {
      const doc = frame.contentWindow.document;
      const observer = new MutationObserver(() => resizeFrame(frame));
      observer.observe(doc.documentElement, { childList: true, subtree: true, attributes: true, characterData: true });
    } catch (error) {}
  });
});

function selectPage(target) {
  if (!frames[target]) return;
  document.querySelectorAll(".page-frame").forEach((frame) => frame.classList.toggle("active", frame.id === target));
  history.replaceState(null, "", `#${target.replace("page-", "")}`);
  setTimeout(resizeActiveFrame, 50);
}

function openHashPage() {
  const hash = window.location.hash.replace("#", "").toLowerCase();
  if (hash === "12m") selectPage("page-12m");
  if (hash === "1m") selectPage("page-1m");
}

window.addEventListener("resize", resizeActiveFrame);
window.addEventListener("hashchange", openHashPage);
window.setInterval(resizeActiveFrame, 1000);
openHashPage();
</script>
